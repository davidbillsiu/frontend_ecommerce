<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro — CasaNobre</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/config.js"></script><script src="js/app.js"></script></head><body>
<main class="container"><div class="panel auth-box" style="max-width:720px">
  <h1>Criar conta</h1>
  <form id="f" novalidate>
    <div class="row">
      <div class="field"><label for="nome">Nome completo *</label><input id="nome" required autocomplete="name"></div>
      <div class="field"><label for="email">E-mail *</label><input id="email" type="email" required autocomplete="email"></div>
    </div>
    <div class="row">
      <div class="field"><label for="cpf">CPF *</label><input id="cpf" inputmode="numeric" placeholder="000.000.000-00" required><span class="err" id="e-cpf"></span></div>
      <div class="field"><label for="tel">Telefone / WhatsApp</label><input id="tel" inputmode="tel" placeholder="(00) 00000-0000"></div>
      <div class="field"><label for="senha">Senha * (mín. 6)</label><input id="senha" type="password" autocomplete="new-password" required></div>
    </div>
    <h3 style="margin-top:8px">Endereço de entrega</h3>
    <div class="row">
      <div class="field"><label for="cep">CEP *</label><input id="cep" inputmode="numeric" placeholder="00000-000" required><span class="hint" id="h-cep">Digite o CEP para autocompletar</span></div>
      <div class="field" style="grid-column:span 2"><label for="logradouro">Rua / Avenida *</label><input id="logradouro" required></div>
    </div>
    <div class="row">
      <div class="field"><label for="numero">Número *</label><input id="numero" required></div>
      <div class="field"><label for="complemento">Complemento</label><input id="complemento"></div>
      <div class="field"><label for="bairro">Bairro *</label><input id="bairro" required></div>
    </div>
    <div class="row">
      <div class="field"><label for="cidade">Cidade *</label><input id="cidade" required></div>
      <div class="field"><label for="estado">UF *</label><input id="estado" maxlength="2" required style="text-transform:uppercase"></div>
    </div>
    <p class="err" id="erro" role="alert"></p>
    <button class="btn block" id="btn">Cadastrar</button>
  </form>
  <p style="text-align:center;margin-top:14px">Já tem conta? <a href="login.html">Entrar</a></p>
</div></main>
<script>
renderHeader('cadastro');
aplicarMascara($('#cpf'), maskCPF); aplicarMascara($('#cep'), maskCEP); aplicarMascara($('#tel'), maskTel);
$('#cpf').addEventListener('blur', () => { const v = $('#cpf').value; $('#e-cpf').textContent = v && !validarCPF(v) ? 'CPF inválido' : ''; });
const campos = { logradouro: $('#logradouro'), bairro: $('#bairro'), cidade: $('#cidade'), estado: $('#estado'), numero: $('#numero') };
$('#cep').addEventListener('input', async () => { if ($('#cep').value.length === 9) { $('#h-cep').textContent = 'Buscando…'; const ok = await buscarCEP($('#cep').value, campos); $('#h-cep').textContent = ok ? 'Endereço preenchido ✓' : 'Preencha manualmente'; } });
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#erro').textContent = '';
  if (!validarCPF($('#cpf').value)) { $('#e-cpf').textContent = 'CPF inválido'; return $('#cpf').focus(); }
  if ($('#senha').value.length < 6) { $('#erro').textContent = 'A senha deve ter ao menos 6 caracteres.'; return; }
  $('#btn').disabled = true;
  try {
    const r = await api('/usuarios', { method: 'POST', body: {
      nome_completo: $('#nome').value, email: $('#email').value, senha: $('#senha').value, cpf: $('#cpf').value, telefone: $('#tel').value,
      endereco: { cep: $('#cep').value, logradouro: $('#logradouro').value, numero: $('#numero').value, complemento: $('#complemento').value, bairro: $('#bairro').value, cidade: $('#cidade').value, estado: $('#estado').value, apelido: 'Casa' } } });
    Sessao.salvar(r.token, r.usuario); toast('Conta criada!', 'ok'); setTimeout(() => (location.href = 'index.html'), 600);
  } catch (err) { $('#erro').textContent = err.message; $('#btn').disabled = false; }
});
renderFooter();
</script></body></html>
